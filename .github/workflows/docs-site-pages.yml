name: Deploy docs-site to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs-site/**'
      - 'landing/**'
      - 'docs/**'
      - 'docs.json'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'scripts/build-site.mjs'
      - '.github/workflows/docs-site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site (landing + docs)
        run: bun run build:site
        env:
          GITHUB_ACTIONS: 'true'

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
